apiVersion: v1
kind: Service
metadata:
  name: {{ include "skein.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "skein.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "skein.selectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
  type: {{ .Values.service.type }}
